add_subject:
  name: "Fach hinzufügen"
  description: "Fügt ein neues Schulfach zur Notenübersicht hinzu."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional, falls nur ein Kind angelegt ist)."
      example: "Max"
      selector:
        text:
    subject:
      name: "Schulfach"
      description: "Name des neuen Schulfachs."
      required: true
      example: "Physik"
      selector:
        text:

remove_subject:
  name: "Fach löschen"
  description: "Löscht ein Schulfach und alle zugehörigen Noten."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    subject:
      name: "Schulfach"
      description: "Name des zu löschenden Schulfachs."
      required: true
      example: "Physik"
      selector:
        text:

add_grade:
  name: "Note hinzufügen"
  description: "Trägt eine neue Schulnote mit frei wählbarer Gewichtung ein."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    subject:
      name: "Schulfach"
      description: "Name des Schulfachs."
      required: true
      example: "Mathematik"
      selector:
        text:
    grade:
      name: "Note"
      description: "Die Schulnote (z.B. 1.0, 1.5, 2.0, 3.0)."
      required: true
      example: 2.0
      selector:
        number:
          min: 1.0
          max: 6.0
          step: 0.1
          mode: box
    weight:
      name: "Gewichtung"
      description: "Gewichtung der Note (z.B. 1-fach, 2-fach, 3-fach, 4-fach)."
      default: "1.0"
      example: "2.0"
      selector:
        select:
          options:
            - label: "1-fach (normal)"
              value: "1.0"
            - label: "2-fach (doppelt)"
              value: "2.0"
            - label: "3-fach (dreifach)"
              value: "3.0"
            - label: "4-fach (vierfach)"
              value: "4.0"
          custom_value: true
    name:
      name: "Beschreibung / Bezeichnung"
      description: "Bezeichnung der Leistung (z.B. 1. Schulaufgabe, Ex 2, Mündlich)."
      example: "1. Schulaufgabe"
      selector:
        text:
    date:
      name: "Datum"
      description: "Datum der Note im Format YYYY-MM-DD (Standard: Heutiges Datum)."
      example: "2026-09-15"
      selector:
        date:

remove_grade:
  name: "Note löschen"
  description: "Löscht eine bestehende Note anhand ihrer ID."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    subject:
      name: "Schulfach"
      description: "Name des Schulfachs."
      required: true
      example: "Mathematik"
      selector:
        text:
    grade_id:
      name: "Noten-ID"
      description: "Eindeutige ID der zu löschenden Note (aus den Sensor-Attributen)."
      required: true
      example: "a1b2c3d4"
      selector:
        text:

set_calendar:
  name: "Kalender zuweisen"
  description: "Verknüpft einen Home Assistant Kalender mit einem Kind für anstehende Klausuren."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    calendar_entity:
      name: "Kalender-Entität"
      description: "Die Kalender-Entität (z. B. calendar.richard_klausuren)."
      example: "calendar.richard_klausuren"
      selector:
        entity:
          domain: calendar

update_timetable_cell:
  name: "Stundenplan-Eintrag aktualisieren"
  description: "Aktualisiert ein Fach, Raum und Lehrer für einen bestimmten Zeitslot und Tag."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    slot_id:
      name: "Slot ID"
      description: "ID des Zeitslots (z. B. slot_1, slot_2, break_1)."
      required: true
      example: "slot_1"
      selector:
        text:
    day:
      name: "Wochentag"
      description: "Wochentag (monday, tuesday, wednesday, thursday, friday)."
      required: true
      example: "monday"
      selector:
        text:
    subject:
      name: "Schulfach"
      description: "Name des Schulfachs oder leer zum Löschen."
      example: "Mathematik"
      selector:
        text:
    room:
      name: "Raum"
      description: "Raumnummer / Raumbezeichnung (optional)."
      example: "R102"
      selector:
        text:
    teacher:
      name: "Lehrkraft"
      description: "Name / Kürzel der Lehrkraft (optional)."
      example: "Fr. Schmidt"
      selector:
        text:

import_timetable:
  name: "Stundenplan per YAML importieren"
  description: "Importiert einen kompletten Stundenplan als YAML-Text oder Datenstruktur."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    yaml_content:
      name: "YAML Inhalt"
      description: "Vollständige Stundenplan-Konfiguration im YAML-Format."
      example: |
        slots:
          - id: slot_1
            label: "1. Stunde"
            start: "08:00"
            end: "08:45"
        schedule:
          slot_1:
            monday:
              subject: "Mathematik"
              room: "R101"
              teacher: "Fr. Müller"
      selector:
        object:

update_settings:
  name: "Allgemeine Einstellungen aktualisieren"
  description: "Aktualisiert das Land / Schulsystem oder den Kalender für eine Kinder-Instanz."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    grade_level:
      name: "Klasse / Jahrgangsstufe"
      description: "Klassenbezeichnung des Kindes (z. B. 5a, 7b, 10c)."
      example: "5a"
      selector:
        text:
    country:
      name: "Land / Schulsystem"
      description: "Ländercode für die Notenskala (DE, AT, CH, FR, IT, ES, NL, PL, UK, US, RU, CN)."
      example: "DE"
      selector:
        select:
          options:
            - label: "Deutschland (1.0 - 6.0)"
              value: "DE"
            - label: "Österreich (1 - 5)"
              value: "AT"
            - label: "Schweiz (6.0 - 1.0)"
              value: "CH"
            - label: "Frankreich (0 - 20)"
              value: "FR"
            - label: "Italien (1 - 10)"
              value: "IT"
            - label: "Spanien (1 - 10)"
              value: "ES"
            - label: "Niederlande (1.0 - 10.0)"
              value: "NL"
            - label: "Polen (1 - 6)"
              value: "PL"
            - label: "Großbritannien (UK)"
              value: "UK"
            - label: "USA (GPA 0.0 - 4.0)"
              value: "US"
            - label: "Russland (2 - 5)"
              value: "RU"
            - label: "China (0 - 100)"
              value: "CN"
    calendar_entity:
      name: "Kalender-Entität"
      description: "Verknüpfte Kalender-Entität (optional)."
      example: "calendar.richard_klausuren"
      selector:
        entity:
          domain: calendar
    show_prep_card:
      name: "Vorbereitung für den nächsten Schultag anzeigen"
      description: "Zeigt den Bereich Vorbereitung für den nächsten Schultag im Dashboard an."
      example: true
      selector:
        boolean:
    show_calendar_card:
      name: "Anstehende Klausuren Termine anzeigen"
      description: "Zeigt den Bereich Anstehende Klausuren & Termine im Dashboard an."
      example: true
      selector:
        boolean:
    show_timetable_card:
      name: "Wochenstundenplan anzeigen"
      description: "Zeigt den Bereich Wochenstundenplan im Dashboard an."
      example: true
      selector:
        boolean:
    show_overview_card:
      name: "Fächer Notenübersicht anzeigen"
      description: "Zeigt den Bereich Fächer & Notenübersicht im Dashboard an."
      example: true
      selector:
        boolean:
    show_back_button:
      name: "Zurück-Button anzeigen"
      description: "Zeigt einen Zurück-Button neben dem Menü in der Kopfzeile an."
      example: false
      selector:
        boolean:

add_calendar_event:
  name: "Klausur / Termin im Kalender erstellen"
  description: "Erstellt einen neuen Kalendereintrag (z. B. Klausur oder Schulaufgabe) im verknüpften Kalender."
  fields:
    child_name:
      name: "Name des Kindes"
      description: "Name des Kindes (optional)."
      example: "Max"
      selector:
        text:
    calendar_entity:
      name: "Kalender-Entität"
      description: "Ziel-Kalender (optional, falls dem Kind bereits zugewiesen)."
      example: "calendar.richard_klausuren"
      selector:
        entity:
          domain: calendar
    summary:
      name: "Terminname / Klausur"
      description: "Titel oder Bezeichnung der Klausur / des Termins."
      required: true
      example: "Mathe Schulaufgabe"
      selector:
        text:
    date:
      name: "Datum"
      description: "Datum des Termins (YYYY-MM-DD)."
      required: true
      example: "2026-09-25"
      selector:
        date:
    start_time:
      name: "Uhrzeit"
      description: "Uhrzeit im Format HH:MM (z. B. 08:00)."
      default: "08:00"
      example: "08:00"
      selector:
        time:
    description:
      name: "Beschreibung"
      description: "Zusatzinformationen, Raumnummer oder Fach (optional)."
      example: "Raum 101, Taschenrechner mitbringen"
      selector:
        text:

